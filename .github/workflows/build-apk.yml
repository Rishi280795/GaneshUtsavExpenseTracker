name: Build Ganesh Utsav APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository files
        uses: actions/checkout@v4

      - name: Extract Android project ZIP
        run: |
          mkdir -p source
          unzip -q project.zip -d source
          echo "Files extracted:"
          find source -maxdepth 5 -type f | head -100

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Find Android project
        id: project
        run: |
          echo "Searching for Android project..."

          GRADLEW=$(find source -type f -name gradlew -print -quit)

          if [ -z "$GRADLEW" ]; then
            echo "ERROR: gradlew not found"
            echo "Contents of source:"
            find source -maxdepth 5 -type f
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLEW")

          echo "Android project found at: $PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Build debug APK
        run: |
          cd "${{ steps.project.outputs.project_dir }}"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GaneshUtsavExpenseTracker-APK
          path: '**/build/outputs/apk/debug/*.apk'
