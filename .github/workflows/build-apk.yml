- name: Build debug APK
        run: |
          echo "Searching for Android project..."
          find source -name gradlew -type f

          PROJECT_DIR=$(dirname "$(find source -name gradlew -type f | head -1)")

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android project not found"
            exit 1
          fi

          echo "Android project found at: $PROJECT_DIR"
          cd "$PROJECT_DIR"

          chmod +x gradlew
          ./gradlew assembleDebug
