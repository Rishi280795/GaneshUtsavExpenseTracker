name: Build Ganesh Utsav APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Download repository files
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          rm -rf source
          mkdir -p source
          unzip -o project.zip -d source

          echo "Files after extraction:"
          find source -maxdepth 4 -type f | head -100

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Find Android project
        id: find_project
        run: |
          echo "Searching for Android project..."

          PROJECT_DIR=$(dirname "$(find source -type f \( -name 'settings.gradle' -o -name 'settings.gradle.kts' \) | head -1)")

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android project not found"
            find source -maxdepth 5 -type f
            exit 1
          fi

          echo "Android project found at: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Build debug APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug --stacktrace

      - name: Find APK
        run: |
          echo "Searching for APK..."
          find "$PROJECT_DIR" -type f -name "*.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Ganesh-Utsav-Expense-Tracker-APK
          path: |
            ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
