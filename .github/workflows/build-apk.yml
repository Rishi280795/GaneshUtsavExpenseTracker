name: Build Ganpati Utsav APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract Android project
        run: |
          rm -rf project
          mkdir project
          unzip -q project.zip -d project
          echo 'Project files:'
          find project -maxdepth 4 -type f | sort | head -100

      - name: Build debug APK
        working-directory: project
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GanpatiUtsavAccounts-debug
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
